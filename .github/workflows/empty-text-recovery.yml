name: empty-text-recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: cli-proxy-api
          - os: windows-latest
            binary: cli-proxy-api.exe
          - os: macos-15
            binary: cli-proxy-api
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Check bounded and backward-compatible diagnostics
        run: python -m unittest tests.test_diagnostics tests.test_http_observation tests.test_runtime_bundle -q
      - name: Install the locked native client without scripts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix tests/claude-client --ignore-scripts --no-audit --no-fund
          python tests/claude_fixture.py
      - name: Reconstruct baseline and candidate from the pinned source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/router-for-me/CLIProxyAPI.git upstream-source
          git -C upstream-source fetch --depth 1 origin 9717e325ba6ab2c7483ea93ccb5f2047eb2e7dd5
          git -C upstream-source checkout --detach FETCH_HEAD
          python - <<'PY'
          import subprocess
          import runtime_bundle
          assert runtime_bundle.PATCHES[-1] == 'empty-text-boundary.patch'
          for name in runtime_bundle.PATCHES[:-1]:
              subprocess.run(['git', '-C', 'upstream-source', 'apply', str(runtime_bundle.SOURCE / 'upstream/patches' / name)], check=True)
          PY
          cd upstream-source
          go mod verify
          go build -o "../baseline-${{ matrix.binary }}" ./cmd/server
          git apply --check ../upstream/patches/empty-text-boundary.patch
          git apply ../upstream/patches/empty-text-boundary.patch
          go test -timeout 180s ./internal/translator/codex/claude ./internal/runtime/executor/helps ./sdk/api/handlers/claude
          go build -o "../candidate-${{ matrix.binary }}" ./cmd/server
          cd ../gateway
          go build -o ../bridge-ingress .
          cd ..
          python runtime_bundle.py --proxy "candidate-${{ matrix.binary }}" --ingress bridge-ingress --output empty-text-bundle
      - name: Check races in text adaptation and observation
        if: runner.os == 'Linux'
        shell: bash
        working-directory: upstream-source
        run: go test -race -timeout 180s ./internal/translator/codex/claude ./internal/runtime/executor/helps
      - name: Preserve native retry inputs and one file effect on both model mappings
        shell: bash
        run: |
          set -euo pipefail
          for family in sol astra; do
            model=gpt-6.1-sol
            behaves=claude-sonnet-5-5
            if [ "$family" = astra ]; then model=gpt-6-astra; behaves=claude-opus-5-5; fi
            python tests/probe_claude_stream_safety.py --proxy-binary "candidate-${{ matrix.binary }}" --codex-executor --codex-origin-binary "baseline-${{ matrix.binary }}" --codex-managed-policy --fixture-model "$model" --fixture-behaves-as "$behaves" --case healthy --case eof_empty_text_part --case eof_empty_text_delta --case eof_empty_text_part_after_tool --case eof_empty_text_delta_after_tool --require-recovery --client-retries 2 --client-timeout 120 --file-output
          done
      - name: Keep native exhaustion bounded after empty text
        shell: bash
        run: |
          set -euo pipefail
          python tests/probe_claude_stream_safety.py --proxy-binary "candidate-${{ matrix.binary }}" --codex-executor --codex-origin-binary "baseline-${{ matrix.binary }}" --codex-managed-policy --case eof_empty_text_part --case eof_empty_text_part_after_tool --reasoning-failures 20 --client-retries 2 --require-failure --client-timeout 120 --file-output
      - name: Preserve cancellation and independent work
        shell: bash
        run: |
          set -euo pipefail
          python tests/probe_native_retry_cancel.py "candidate-${{ matrix.binary }}" --origin-binary "baseline-${{ matrix.binary }}" --mode active --family sol
          python tests/probe_native_retry_cancel.py "candidate-${{ matrix.binary }}" --origin-binary "baseline-${{ matrix.binary }}" --mode backoff --family astra
      - name: Retain auto classification and explicit permission denial
        shell: bash
        run: |
          set -euo pipefail
          python tests/probe_auto_classifier.py --proxy-binary "candidate-${{ matrix.binary }}" --origin-binary "baseline-${{ matrix.binary }}" --verdict allow
          python tests/probe_auto_classifier.py --proxy-binary "candidate-${{ matrix.binary }}" --origin-binary "baseline-${{ matrix.binary }}" --verdict deny
          python tests/probe_auto_classifier.py --proxy-binary "candidate-${{ matrix.binary }}" --origin-binary "baseline-${{ matrix.binary }}" --verdict allow --deny-rule
      - name: Preserve recovery after a delayed empty-text boundary
        shell: bash
        run: |
          set -euo pipefail
          python tests/probe_claude_stream_safety.py --proxy-binary "candidate-${{ matrix.binary }}" --codex-executor --codex-origin-binary "baseline-${{ matrix.binary }}" --codex-managed-policy --fixture-model gpt-6-astra --fixture-behaves-as claude-opus-5-5 --case eof_empty_text_delta --reasoning-delay-seconds 65 --require-recovery --client-retries 2 --client-timeout 120 --file-output
      - name: Contrast interactive empty starts with real delivered text
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          for family in sol astra; do
            for tail in part delta; do
              python tests/probe_opaque_reasoning_ui.py "baseline-${{ matrix.binary }}" --origin-binary "baseline-${{ matrix.binary }}" --family "$family" --empty-tail "$tail" --require-failure
              python tests/probe_opaque_reasoning_ui.py "candidate-${{ matrix.binary }}" --origin-binary "baseline-${{ matrix.binary }}" --family "$family" --empty-tail "$tail" --require-recovery
            done
            python tests/probe_opaque_reasoning_ui.py "candidate-${{ matrix.binary }}" --origin-binary "baseline-${{ matrix.binary }}" --family "$family" --empty-tail text --require-failure
          done
          python tests/probe_opaque_reasoning_ui.py "candidate-${{ matrix.binary }}" --origin-binary "baseline-${{ matrix.binary }}" --empty-tail part --unmapped-output --require-failure
      - name: Preserve a held stream and persistent client during handoff
        shell: bash
        run: |
          set -euo pipefail
          CLAUDE_CODEX_STREAM_DIAGNOSTICS=1 python tests/smoke_managed_runtime.py empty-text-bundle --claude-client --previous-proxy "baseline-${{ matrix.binary }}"
