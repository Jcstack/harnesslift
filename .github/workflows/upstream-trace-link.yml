name: upstream-trace-link

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: ''
          - os: macos-15
            suffix: ''
          - os: windows-latest
            suffix: '.exe'
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Check bounded private reporting and the reviewed source profile
        run: python -m unittest tests.test_trace_link_fixture tests.test_diagnostics tests.test_http_observation tests.test_runtime_bundle -q
      - name: Install the integrity-locked native client
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix tests/claude-client --ignore-scripts --no-audit --no-fund
          python tests/claude_fixture.py
      - name: Build independent selected and observed proxy profiles
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/router-for-me/CLIProxyAPI.git upstream-source
          git -C upstream-source fetch --depth 1 origin 9717e325ba6ab2c7483ea93ccb5f2047eb2e7dd5
          git -C upstream-source checkout --detach FETCH_HEAD
          python - <<'PY'
          import subprocess
          import runtime_bundle
          assert 'codex-upstream-link-candidate.patch' in runtime_bundle.PATCHES
          for name in runtime_bundle.PATCHES:
              if name == 'codex-upstream-link-candidate.patch':
                  continue
              subprocess.run(['git', '-C', 'upstream-source', 'apply', str(runtime_bundle.SOURCE / 'upstream' / 'patches' / name)], check=True)
          PY
          cd upstream-source
          go mod verify
          go build -o "../selected-proxy${{ matrix.suffix }}" ./cmd/server
          git apply --check ../upstream/patches/codex-upstream-link-candidate.patch
          git apply ../upstream/patches/codex-upstream-link-candidate.patch
          go test -timeout 180s -run '^(TestBridge|TestCodex)' ./internal/runtime/executor ./internal/runtime/executor/helps
          go test -timeout 180s ./sdk/api/handlers/claude
          go build -o "../observed-proxy${{ matrix.suffix }}" ./cmd/server
          cd ../gateway
          go build -o "../trace-ingress${{ matrix.suffix }}" .
          cd ..
          python runtime_bundle.py --proxy "observed-proxy${{ matrix.suffix }}" --ingress "trace-ingress${{ matrix.suffix }}" --output trace-bundle
      - name: Race-check privacy, expiry and unchanged response handling
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cd upstream-source
          go test -race -timeout 180s -run '^(TestBridge|TestCodex)' ./internal/runtime/executor ./internal/runtime/executor/helps
      - name: Observe mixed-generation requests through the actual TLS ingress
        shell: bash
        run: |
          set -euo pipefail
          python tests/probe_upstream_trace_link.py "selected-proxy${{ matrix.suffix }}" "observed-proxy${{ matrix.suffix }}" "trace-ingress${{ matrix.suffix }}"
      - name: Preserve harness recovery and one completed tool effect
        shell: bash
        run: |
          set -euo pipefail
          python tests/probe_claude_stream_safety.py --proxy-binary "observed-proxy${{ matrix.suffix }}" --codex-executor --codex-origin-binary "selected-proxy${{ matrix.suffix }}" --codex-managed-policy --case eof_empty_text_part_after_tool --require-recovery --client-timeout 90 --file-output
          python tests/probe_claude_stream_safety.py --proxy-binary "observed-proxy${{ matrix.suffix }}" --codex-executor --codex-origin-binary "selected-proxy${{ matrix.suffix }}" --codex-managed-policy --fixture-model gpt-6-astra --fixture-behaves-as claude-opus-5-5 --case eof_empty_text_part_after_tool --require-recovery --client-timeout 90 --file-output
      - name: Preserve the stable ingress and an admitted old stream during handoff
        shell: bash
        run: |
          set -euo pipefail
          CLAUDE_CODEX_STREAM_DIAGNOSTICS=1 python tests/smoke_managed_runtime.py trace-bundle --claude-client --previous-proxy "selected-proxy${{ matrix.suffix }}"
